name: Déploiement (validation)

# Valide tout ce que deploy/ décrit, sans identifiant cloud : règles d'alerte et pannes injectées (promtool),
# routage (amtool), collecteur, charts Helm de chaque taille contre les schémas Kubernetes et CRD, OpenTofu ;
# puis Keycloak dans une cellule kind jetable.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_VERSION: 3.6.0
  ALERTMANAGER_VERSION: 0.28.1
  KUBECONFORM_VERSION: 0.7.0

jobs:
  valider:
    name: IaC, règles et routage des alertes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - name: Outils Prometheus et kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/bin" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/bin" "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Valider deploy/
        run: deploy/tests/valider.sh

  essai-panne:
    name: Panne injectée (API arrêtée → appel S1)
    runs-on: ubuntu-latest
    needs: valider
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Prometheus et Alertmanager
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/bin" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/bin" "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/alertmanager" "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Essai de bout en bout
        run: deploy/local/essai-panne.sh
      - name: Journaux de l'essai
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essai-panne
          path: |
            deploy/local/.run/*.log
            deploy/local/.run/astreinte/*.jsonl
          include-hidden-files: true

  # Keycloak dans la cellule : cluster kind jetable, opérateur CloudNativePG, chart lettra-cell (Keycloak, sa base,
  # l'API construite ici). Découverte du realm, /health et connexion BFF de l'API, boucle locale du client MAUI, MFA.
  keycloak-kind:
    name: Keycloak dans la cellule (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SORTIE: ${{ github.workspace }}/deploy/tests/kind/.run
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Essai de la cellule
        run: deploy/tests/kind/essai-keycloak.sh
      - name: Journaux de l'essai
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-kind
          path: deploy/tests/kind/.run/
          include-hidden-files: true
          if-no-files-found: warn

  # La démonstration de deploy/demo, de bout en bout dans Chromium : Keycloak + API + PWA, connexion avec
  # enrôlement TOTP, écran et création de client, manifeste et service worker ; puis le profil HTTPS du réseau local.
  demo-navigateur:
    name: Démo navigateur (Keycloak + API + PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml
      COMPOSE_LAN: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml -f ${{ github.workspace }}/deploy/demo/compose.lan.yaml
      SORTIE: ${{ github.workspace }}/deploy/demo/e2e/sortie
    steps:
      - uses: actions/checkout@v5

      - name: Construction de l'image de l'API
        run: $COMPOSE build

      - name: Démarrage (localhost)
        run: |
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          curl -sf http://localhost:8081/realms/lettra/.well-known/openid-configuration | jq -r .issuer

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Playwright (Chromium)
        working-directory: deploy/demo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Première connexion (enrôlement TOTP), client, PWA, seconde connexion
        working-directory: deploy/demo/e2e
        run: |
          set -a; . ../.env; set +a
          SORTIE="$SORTIE/localhost" node parcours.mjs premier

      # Serveur commun (docs/serveur-commun.md) : la composition de l'application installée reliée au serveur
      # (harnais serveur-commun, sans MAUI) se connecte par PKCE, voit le client du navigateur et en crée un que le
      # navigateur retrouve.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Serveur commun — appareil et navigateur sur les mêmes données
        working-directory: deploy/demo/e2e
        run: |
          set -a; . ../.env; set +a
          export SORTIE="$SORTIE/localhost"
          # Les journaux des jobs ne sont pas toujours lisibles : en cas d'échec, la fin de la sortie devient une annotation.
          signaler() { echo "::error title=Serveur commun ($1)::$(tail -n 40 "$2" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          dotnet run --project serveur-commun -- "$(cat "$SORTIE/client.txt")" 2>&1 | tee "$SORTIE/serveur-commun.log"
          [ "${PIPESTATUS[0]}" = 0 ] || signaler appareil "$SORTIE/serveur-commun.log"
          node appareil.mjs voir "$(cat "$SORTIE/client-appareil.txt")" 2>&1 | tee "$SORTIE/appareil-voir.log"
          [ "${PIPESTATUS[0]}" = 0 ] || signaler navigateur "$SORTIE/appareil-voir.log"

      # Voix : le conteneur whisper télécharge son modèle (142 Mio) au premier démarrage, sans retenir « up --wait ».
      # Le modèle doit être chargé avant la mise à jour ci-dessous, qui vérifie qu'il n'est pas retéléchargé.
      - name: Voix — modèle Whisper téléchargé et serveur prêt
        run: |
          timeout 600 bash -c "until $COMPOSE exec -T whisper curl -fsS -o /dev/null http://127.0.0.1:8080/; do sleep 5; done"
          $COMPOSE logs --no-color whisper | grep -q 'Téléchargement de ggml-base.bin' || { echo "premier démarrage sans téléchargement du modèle ?"; exit 1; }

      # Mise à jour comme chez l'utilisateur (git pull, puis up --build) : arrêt sans -v, nouvelle image de l'API avec
      # une nouvelle version de l'application web (index.html marqué, manifeste du service worker changé), redémarrage
      # sur les mêmes volumes. Pendant ce temps un onglet reste ouvert : il doit proposer « Recharger », et un onglet
      # ouvert juste après doit se recharger seul sur la nouvelle version (mise-a-jour.mjs). Le client créé avant doit
      # être là, et le jeu de démonstration ne doit pas être rechargé.
      - name: Mise à jour de l'API (nouvelle image, mêmes volumes), navigateur déjà ouvert à jour, données conservées
        working-directory: deploy/demo/e2e
        env:
          LETTRA_BUILD_ATTENDU: maj-${{ github.run_id }}
        run: |
          export avant=$(docker image inspect -f '{{.Id}}' lettra-demo-api)
          cat > "$RUNNER_TEMP/mise-a-jour.sh" <<'FIN'
          set -euo pipefail
          $COMPOSE down
          www="$RUNNER_TEMP/nouvelle-version"
          rm -rf "$www" && mkdir -p "$www"
          id=$(docker create lettra-demo-api)
          docker cp "$id:/app/wwwroot/index.html" "$www/"
          docker cp "$id:/app/wwwroot/service-worker-assets.js" "$www/"
          docker rm "$id" > /dev/null
          bash nouvelle-version.sh "$www" "$LETTRA_BUILD_ATTENDU"
          printf 'FROM lettra-demo-api\nLABEL fr.lettra.demo.mise-a-jour=%s\nCOPY index.html service-worker-assets.js /app/wwwroot/\n' "$GITHUB_RUN_ID" > "$www/Dockerfile"
          docker build -q -t lettra-demo-api "$www"
          [ "$(docker image inspect -f '{{.Id}}' lettra-demo-api)" != "$avant" ] || { echo "image de l'API inchangée"; exit 1; }
          docker volume inspect lettra-demo_lettra-donnees lettra-demo_keycloak-donnees lettra-demo_whisper-modeles > /dev/null
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          FIN
          mkdir -p "$SORTIE/localhost"
          signaler() { echo "::error title=Mise à jour dans le navigateur::$(tail -n 40 "$1" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          SORTIE="$SORTIE/localhost" node mise-a-jour.mjs "bash $RUNNER_TEMP/mise-a-jour.sh" 2>&1 | tee "$SORTIE/localhost/mise-a-jour-sortie.log"
          [ "${PIPESTATUS[0]}" = 0 ] || signaler "$SORTIE/localhost/mise-a-jour-sortie.log"
          if $COMPOSE logs --no-color api | grep -q 'Jeu de démonstration .* chargé dans'; then
            echo "le jeu de démonstration a été rechargé par-dessus le dossier existant"; exit 1
          fi
          # Le modèle Whisper est resté dans son volume : prêt sans nouveau téléchargement.
          timeout 120 bash -c "until $COMPOSE exec -T whisper curl -fsS -o /dev/null http://127.0.0.1:8080/; do sleep 3; done"
          if $COMPOSE logs --no-color whisper | grep -q 'Téléchargement de ggml'; then
            echo "le modèle Whisper a été retéléchargé après la mise à jour"; exit 1
          fi
          set -a; . ../.env; set +a
          SORTIE="$SORTIE/localhost" node parcours.mjs suivant

      - name: Profil réseau local (HTTPS, nom d'hôte hors localhost)
        env:
          LETTRA_DEMO_HOST: lettra-demo.test
        run: |
          echo "127.0.0.1 lettra-demo.test" | sudo tee -a /etc/hosts
          $COMPOSE_LAN up -d --wait --remove-orphans
          timeout 120 bash -c 'until curl -sf -o "$RUNNER_TEMP/ca.crt" http://localhost:8079/lettra-demo-ca.crt; do sleep 2; done'
          openssl x509 -in "$RUNNER_TEMP/ca.crt" -noout -subject
          timeout 180 bash -c 'until curl -sf --cacert "$RUNNER_TEMP/ca.crt" https://lettra-demo.test:8443/health; do sleep 2; done'
          # Le certificat racine approuvé comme sur un téléphone : base NSS de Chromium.
          sudo apt-get install -y -qq libnss3-tools > /dev/null
          mkdir -p "$HOME/.pki/nssdb"
          [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n lettra-demo -i "$RUNNER_TEMP/ca.crt"

      - name: Parcours en HTTPS (https://lettra-demo.test:8443)
        working-directory: deploy/demo/e2e
        env:
          LETTRA_URL: https://lettra-demo.test:8443
        run: |
          set -a; . ../.env; set +a
          SORTIE="$SORTIE/reseau-local" node parcours.mjs premier

      - name: Journaux
        if: always()
        env:
          LETTRA_DEMO_HOST: lettra-demo.test
        run: |
          mkdir -p "$SORTIE"
          $COMPOSE_LAN ps -a > "$SORTIE/compose-ps.txt" 2>&1 || true
          for s in keycloak api proxy whisper; do $COMPOSE_LAN logs --no-color "$s" > "$SORTIE/$s.log" 2>&1 || true; done

      - name: Captures, traces et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-navigateur
          path: deploy/demo/e2e/sortie/
          if-no-files-found: warn

      - name: Arrêt
        if: always()
        env:
          LETTRA_DEMO_HOST: lettra-demo.test
        run: $COMPOSE_LAN down -v

  # Charge légère (k6) sur la pile de démonstration : santé et enveloppe PWA en anonyme, lectures authentifiées du
  # dossier de démonstration avec la session du BFF ouverte par Playwright (mot de passe + TOTP), puis une rafale
  # qui doit déclencher la limite de débit (429). Seuils : deploy/tests/k6/fumee.js.
  demo-charge:
    name: Démo — charge k6 (fumée)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml
      # Session exportée hors des dossiers publiés en artefact.
      SORTIE: ${{ github.workspace }}/.session-k6
      K6_SORTIE: ${{ github.workspace }}/deploy/tests/k6/sortie
      K6_VERSION: 1.3.0
    steps:
      - uses: actions/checkout@v5

      - name: Construction de l'image de l'API
        run: $COMPOSE build

      - name: Démarrage (localhost)
        run: |
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Playwright (Chromium)
        working-directory: deploy/demo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Connexion complète (mot de passe + TOTP) et export de la session du BFF
        working-directory: deploy/demo/e2e
        run: |
          set -a; . ../.env; set +a
          node parcours.mjs session
          echo "::add-mask::$(cat "$SORTIE/session-cookie.txt")"

      # Voix branchée de bout en bout : statut avec la session du BFF, puis un son d'une seconde envoyé à l'API, qui le
      # transmet au conteneur whisper (modèle chargé). 200 (texte) ou 400 « rien entendu » : le moteur a répondu ;
      # 503 : l'API ne joint pas le serveur Whisper.
      - name: Voix — statut et transcription par le serveur whisper.cpp
        run: |
          timeout 600 bash -c "until $COMPOSE exec -T whisper curl -fsS -o /dev/null http://127.0.0.1:8080/; do sleep 5; done"
          entetes=(-H "Cookie: $(cat "$SORTIE/session-cookie.txt")" -H 'X-Lettra-Csrf: 1' -H 'X-Dossier: 0199e3a0-0000-7000-8000-00000000d051')
          curl -fsS "${entetes[@]}" http://localhost:8080/api/v1/voix/statut | tee "$RUNNER_TEMP/voix-statut.json"
          echo
          jq -e '.enabled == true and .engine == "whisper-serveur" and .onDevice == false' "$RUNNER_TEMP/voix-statut.json" > /dev/null
          python3 -c "
          import math, struct, sys, wave
          with wave.open(sys.argv[1], 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b''.join(struct.pack('<h', int(8000 * math.sin(2 * math.pi * 440 * i / 16000))) for i in range(16000)))
          " "$RUNNER_TEMP/son.wav"
          code=$(curl -sS -o "$RUNNER_TEMP/voix-transcription.json" -w '%{http_code}' "${entetes[@]}" \
            -H 'Content-Type: audio/wav' --data-binary @"$RUNNER_TEMP/son.wav" \
            'http://localhost:8080/api/v1/voix/transcription?mode=Dictation&langue=fr')
          echo "transcription : HTTP $code"; cat "$RUNNER_TEMP/voix-transcription.json"; echo
          case "$code" in
            200) ;;
            400) jq -e '.code == "Speech.NothingHeard"' "$RUNNER_TEMP/voix-transcription.json" > /dev/null ;;
            *) echo "le serveur Whisper n'a pas répondu à l'API"; exit 1 ;;
          esac

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: k6 — profil de fumée (~1 min)
        env:
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: ${{ github.workspace }}/deploy/tests/k6/sortie/rapport.html
        run: |
          mkdir -p "$K6_SORTIE"
          LETTRA_SESSION_COOKIE="$(cat "$SORTIE/session-cookie.txt")" k6 run deploy/tests/k6/fumee.js

      - name: Journaux
        if: always()
        run: |
          mkdir -p "$K6_SORTIE"
          for s in keycloak api whisper; do $COMPOSE logs --no-color "$s" > "$K6_SORTIE/$s.log" 2>&1 || true; done
          cp "$SORTIE"/*.png "$K6_SORTIE/" 2>/dev/null || true

      - name: Rapports k6 (résumé JSON et texte, tableau de bord HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-charge-k6
          path: deploy/tests/k6/sortie/
          if-no-files-found: warn

      - name: Arrêt
        if: always()
        run: $COMPOSE down -v

  # Télémétrie de la démonstration dans Grafana (deploy/demo/compose.observabilite.yaml) : collecteur filtrant de la
  # cellule, Prometheus, Tempo, Loki et Grafana provisionné. Après une connexion complète et deux minutes d'activité k6
  # (profil « activite »), chaque panneau des trois tableaux de bord doit avoir des données, les exemplaires doivent
  # mener à une trace qui a ses journaux, et les règles d'alerte de la cellule doivent être visibles : deploy/tests/grafana.
  demo-grafana:
    name: Démo — télémétrie dans Grafana
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml -f ${{ github.workspace }}/deploy/demo/compose.observabilite.yaml
      # Session exportée hors des dossiers publiés en artefact.
      SORTIE: ${{ github.workspace }}/.session-k6
      K6_SORTIE: ${{ github.workspace }}/deploy/tests/grafana/sortie
      K6_VERSION: 1.3.0
    steps:
      - uses: actions/checkout@v5

      - name: Construction de l'image de l'API et images de l'observabilité
        run: |
          $COMPOSE build
          $COMPOSE pull --quiet --ignore-buildable

      - name: Démarrage (démonstration + collecteur, Prometheus, Tempo, Loki, Grafana)
        run: |
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'
          # Lecture sans connexion : un visiteur anonyme voit les tableaux de bord.
          curl -sf http://localhost:3000/api/dashboards/uid/lettra-activite | jq -r .dashboard.title

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Playwright (Chromium)
        working-directory: deploy/demo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Connexion complète (mot de passe + TOTP) et export de la session du BFF
        working-directory: deploy/demo/e2e
        run: |
          set -a; . ../.env; set +a
          node parcours.mjs session
          echo "::add-mask::$(cat "$SORTIE/session-cookie.txt")"

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: k6 — activité de démonstration (2 min)
        run: |
          mkdir -p "$K6_SORTIE"
          LETTRA_SESSION_COOKIE="$(cat "$SORTIE/session-cookie.txt")" \
            k6 run -e LETTRA_PROFIL=activite -e LETTRA_DUREE=2m deploy/tests/k6/fumee.js

      - name: Grafana — sources, tableaux de bord, données de chaque panneau, liens et alertes
        run: |
          set -a; . deploy/demo/.env; set +a
          python3 deploy/tests/grafana/verifier.py --bilan "$K6_SORTIE/bilan-grafana.md"

      - name: Bilan dans le résumé
        if: always()
        run: cat "$K6_SORTIE/bilan-grafana.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Journaux
        if: always()
        run: |
          mkdir -p "$K6_SORTIE"
          for s in keycloak api otel-collector prometheus tempo loki grafana; do $COMPOSE logs --no-color "$s" > "$K6_SORTIE/$s.log" 2>&1 || true; done

      - name: Bilan, rapports k6 et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-grafana
          path: deploy/tests/grafana/sortie/
          if-no-files-found: warn

      - name: Arrêt
        if: always()
        run: $COMPOSE down -v

  # Scan ZAP de base (passif, sans authentification) de http://localhost:8080/ : échoue sur une règle classée FAIL
  # dans deploy/tests/zap/rules.tsv ou sur toute constatation de risque faible ou plus qui n'y est pas classée.
  demo-zap:
    name: Démo — scan de sécurité ZAP (base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml
      ZAP_IMAGE: zaproxy/zap-stable:2.16.1
      ZAP_SORTIE: ${{ github.workspace }}/deploy/tests/zap/sortie
    steps:
      - uses: actions/checkout@v5

      - name: Construction de l'image de l'API et image ZAP
        run: |
          $COMPOSE build
          docker pull -q "$ZAP_IMAGE"

      - name: Démarrage (localhost)
        run: |
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          curl -sfI http://localhost:8080/

      - name: Scan ZAP de base
        run: |
          mkdir -p "$ZAP_SORTIE" && chmod 777 "$ZAP_SORTIE"
          cp deploy/tests/zap/rules.tsv "$ZAP_SORTIE/"
          set +e
          docker run --rm --network host -v "$ZAP_SORTIE:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:8080/ -c rules.tsv -I \
            -r rapport.html -J rapport.json -w rapport.md
          code=$?
          set -e
          # 0 : rien en FAIL ; 1 : au moins une règle FAIL ; autre : erreur du scan.
          deploy/tests/zap/verifier.sh "$ZAP_SORTIE/rapport.json"
          exit $code

      - name: Journaux
        if: always()
        run: |
          mkdir -p "$ZAP_SORTIE"
          $COMPOSE logs --no-color api > "$ZAP_SORTIE/api.log" 2>&1 || true

      - name: Rapports ZAP (HTML, JSON, Markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-zap
          path: deploy/tests/zap/sortie/
          if-no-files-found: warn

      - name: Arrêt
        if: always()
        run: $COMPOSE down -v
