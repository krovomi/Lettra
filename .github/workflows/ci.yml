name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: Build et tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # La restauration échoue sur toute vulnérabilité connue (NuGetAudit, avertissements bloquants).
      - name: Restauration et audit des dépendances
        run: dotnet restore Lettra.Ci.slnf

      - name: Build (analyseurs, nullable, avertissements bloquants)
        run: dotnet build Lettra.Ci.slnf -c Release --no-restore

      # Tests d'architecture, domaine, application, API, UI ; persistance sur SQLite, PostgreSQL et
      # SQL Server (Testcontainers) ; test « aucune donnée de dossier dans les journaux ».
      - name: Tests
        run: dotnet test Lettra.Ci.slnf -c Release --no-build --logger "trx;LogFilePrefix=lettra" --results-directory TestResults
        env:
          LETTRA_PDF_SAMPLES: ${{ github.workspace }}/pdf-samples
          LETTRA_EINVOICE_SAMPLES: ${{ github.workspace }}/einvoice-samples

      # Les PDF des devis et factures (Lettra.Printing) doivent être PDF/A-3b : base du Factur-X (phase 5).
      - name: Conformité PDF/A-3b (veraPDF)
        run: build/verapdf/validate.sh pdf-samples

      # Factures électroniques (module Exports, phase 5) : CII et UBL au Schematron EN 16931 officiel, puis Mustang
      # (schémas XSD, Factur-X et PDF/A-3 des Factur-X).
      - name: Conformité EN 16931 et Factur-X
        run: build/einvoice/validate.sh einvoice-samples pdf-samples

      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Avis de tiers (notice MIT de Paperasse)
        run: build/check-third-party-notices.sh

  maui-windows:
    name: Build MAUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Charge de travail MAUI
        run: dotnet workload install maui-windows
      - name: Build Lettra.App.Maui
        run: dotnet build src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release
      # Version de démonstration : autonome (runtime .NET et Windows App SDK embarqués), sans installation. Le dossier
      # téléchargé se décompresse et Lettra.App.Maui.exe se lance tel quel (README, « Démarrer la démo »).
      - name: Version de démonstration
        run: dotnet publish src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained -p:WindowsAppSDKSelfContained=true -o artifacts/lettra-windows
      # Premier lancement réel : cabinet local et premier dossier chiffré créés, fenêtre ouverte, sans arrêt.
      - name: Premier lancement de la démonstration
        shell: pwsh
        run: |
          $app = Start-Process artifacts/lettra-windows/Lettra.App.Maui.exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          do { Start-Sleep 5; $app.Refresh() } until ($app.HasExited -or $app.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
          if ($app.HasExited) { throw "Lettra s'est arrêté au démarrage (code $($app.ExitCode))." }
          if ($app.MainWindowHandle -eq 0) { throw "Aucune fenêtre après 90 s." }
          Start-Sleep 10
          if ($app.HasExited) { throw "Lettra s'est arrêté après l'ouverture de la fenêtre (code $($app.ExitCode))." }
          $dossiers = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter *.lettra -ErrorAction SilentlyContinue
          if (-not $dossiers) { throw "Aucun dossier local créé sous $env:LOCALAPPDATA." }
          "Fenêtre : $($app.MainWindowTitle)"
          "Dossiers locaux : $($dossiers.DirectoryName | Sort-Object -Unique)"
          Stop-Process $app
      - uses: actions/upload-artifact@v4
        with:
          name: lettra-windows
          path: artifacts/lettra-windows
          retention-days: 90
      # Version de mesure de la grille (critère J1) : exécutable autonome, à lancer sur un poste du cabinet.
      - name: Version de mesure de la grille
        run: dotnet publish src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -p:LettraGridBenchmark=true -o artifacts/mesure-grille
      - uses: actions/upload-artifact@v4
        with:
          name: lettra-mesure-grille-windows
          path: artifacts/mesure-grille
          retention-days: 30

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Lettra.Ci.slnf
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lettra.cdx.json
          upload-artifact: true

  codeql:
    name: Analyse statique de sécurité (CodeQL)
    # CodeQL exige GitHub Advanced Security sur un dépôt privé : sinon, ce sont les analyseurs .NET
    # (règles de sécurité CA2xxx/CA3xxx, bloquantes au build) qui font office d'analyse statique.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build Lettra.Ci.slnf -c Release
      - uses: github/codeql-action/analyze@v3

  image:
    name: Image signée
    needs: [build-test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature sans clé (Sigstore, OIDC GitHub)
    strategy:
      matrix:
        include:
          - image: lettra-api
            dockerfile: Dockerfile
          - image: lettra-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:ci
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et publication
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Signature de l'image
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
