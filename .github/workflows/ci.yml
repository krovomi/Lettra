name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: Build et tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # La restauration échoue sur toute vulnérabilité connue (NuGetAudit, avertissements bloquants).
      - name: Restauration et audit des dépendances
        run: dotnet restore Lettra.Ci.slnf

      - name: Build (analyseurs, nullable, avertissements bloquants)
        run: dotnet build Lettra.Ci.slnf -c Release --no-restore

      # Tests d'architecture, domaine, application, API, UI ; persistance sur SQLite, PostgreSQL et
      # SQL Server (Testcontainers) ; test « aucune donnée de dossier dans les journaux ».
      - name: Tests
        run: dotnet test Lettra.Ci.slnf -c Release --no-build --logger "trx;LogFilePrefix=lettra" --results-directory TestResults
        env:
          LETTRA_PDF_SAMPLES: ${{ github.workspace }}/pdf-samples
          LETTRA_EINVOICE_SAMPLES: ${{ github.workspace }}/einvoice-samples

      # Les PDF des devis et factures (Lettra.Printing) doivent être PDF/A-3b : base du Factur-X (phase 5).
      - name: Conformité PDF/A-3b (veraPDF)
        run: build/verapdf/validate.sh pdf-samples

      # Factures électroniques (module Exports, phase 5) : CII et UBL au Schematron EN 16931 officiel, puis Mustang
      # (schémas XSD, Factur-X et PDF/A-3 des Factur-X).
      - name: Conformité EN 16931 et Factur-X
        run: build/einvoice/validate.sh einvoice-samples pdf-samples

      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Avis de tiers (notice MIT de Paperasse)
        run: build/check-third-party-notices.sh

  # Système de design (docs/design/systeme-de-design.md) : la galerie des écrans (GalleryTests) photographiée à 375,
  # 768 et 1440 px dans chaque thème, sans défilement horizontal et sans constat axe WCAG 2.2 AA (build/design-captures.cjs).
  design-captures:
    name: Captures du design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Galerie des écrans
        run: |
          dotnet build tests/Lettra.UI.Tests -c Release
          LETTRA_GALLERY_DIR=$PWD/artifacts/galerie dotnet test tests/Lettra.UI.Tests -c Release --no-build --filter Galerie_des_ecrans

      # Même Playwright que le parcours de la démonstration ; axe-core à version fixe.
      - name: Playwright (Chromium) et axe-core
        run: |
          npm ci --prefix deploy/demo/e2e
          (cd deploy/demo/e2e && npx playwright install --with-deps chromium)
          npm install --prefix "$RUNNER_TEMP/axe" --no-save --no-package-lock axe-core@4.10.2

      - name: Captures et audit d'accessibilité
        run: NODE_PATH=$PWD/deploy/demo/e2e/node_modules node build/design-captures.cjs artifacts/galerie "$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galerie-design
          path: artifacts/galerie
          retention-days: 30

  maui-windows:
    name: Build MAUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Charge de travail MAUI
        run: dotnet workload install maui-windows
      - name: Build Lettra.App.Maui
        run: dotnet build src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release
      # Version de démonstration : autonome (runtime .NET et Windows App SDK embarqués), sans installation. Le dossier
      # téléchargé se décompresse et Lettra.App.Maui.exe se lance tel quel (README, « Démarrer la démo »).
      - name: Version de démonstration
        run: dotnet publish src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained -p:WindowsAppSDKSelfContained=true -o artifacts/lettra-windows
      # Premier lancement réel : cabinet local et premier dossier chiffré créés, fenêtre ouverte, sans arrêt.
      - name: Premier lancement de la démonstration
        shell: pwsh
        run: |
          $app = Start-Process artifacts/lettra-windows/Lettra.App.Maui.exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          do { Start-Sleep 5; $app.Refresh() } until ($app.HasExited -or $app.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
          if ($app.HasExited) { throw "Lettra s'est arrêté au démarrage (code $($app.ExitCode))." }
          if ($app.MainWindowHandle -eq 0) { throw "Aucune fenêtre après 90 s." }
          Start-Sleep 10
          if ($app.HasExited) { throw "Lettra s'est arrêté après l'ouverture de la fenêtre (code $($app.ExitCode))." }
          # Emplacement documenté dans le README (« Où sont les données »).
          $dossiers = Get-ChildItem "$env:LOCALAPPDATA\Lettra\Lettra.App.Maui\Data\dossiers" -Filter *.lettra -ErrorAction SilentlyContinue
          if (-not $dossiers) { throw "Aucun dossier local créé sous $env:LOCALAPPDATA\Lettra\Lettra.App.Maui\Data." }
          "Fenêtre : $($app.MainWindowTitle)"
          "Dossiers locaux : $($dossiers.DirectoryName | Sort-Object -Unique)"
          Stop-Process $app
      - uses: actions/upload-artifact@v4
        with:
          name: lettra-windows
          path: artifacts/lettra-windows
          retention-days: 90
      # Version de mesure de la grille (critère J1) : exécutable autonome, à lancer sur un poste du cabinet.
      - name: Version de mesure de la grille
        run: dotnet publish src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -p:LettraGridBenchmark=true -o artifacts/mesure-grille
      - uses: actions/upload-artifact@v4
        with:
          name: lettra-mesure-grille-windows
          path: artifacts/mesure-grille
          retention-days: 30

  maui-android:
    name: MAUI Android (APK et émulateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Charge de travail MAUI Android
        run: dotnet workload install maui-android
      # APK signé avec la clé de démonstration versionnée (pas de magasin d'applications) : la même à chaque
      # construction, pour qu'« adb install -r » d'une nouvelle version garde les données du téléphone.
      - name: Build de l'APK
        run: |
          dotnet publish src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory=$ANDROID_HOME -o artifacts/lettra-android
          apk=$(ls artifacts/lettra-android/*-Signed.apk | head -n 1)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certificat-apk.txt"
          grep -q "CN=Lettra demonstration" "$RUNNER_TEMP/certificat-apk.txt" || { echo "APK non signé avec la clé de démonstration"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: lettra-android
          path: artifacts/lettra-android/*-Signed.apk
          retention-days: 90
      - name: Accélération matérielle de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Premier lancement réel : activité au premier plan, sans plantage, cabinet local et premier dossier chiffré créés
      # dans le dossier de données de l'application (FileSystem.AppDataDirectory = /data/user/0/fr.lettra.app/files).
      - name: Script de premier lancement
        run: |
          cat > "$RUNNER_TEMP/lancement-android.sh" <<'EOF'
          set -euo pipefail
          mkdir -p artifacts/android-run
          apk=$(ls artifacts/lettra-android/*-Signed.apk | head -n 1)
          adb install -r "$apk"
          adb logcat -c
          adb shell am start -W -n fr.lettra.app/.MainActivity
          data=/data/user/0/fr.lettra.app/files/dossiers
          adb root >/dev/null 2>&1 || true
          adb wait-for-device
          dossiers=""
          for _ in $(seq 1 36); do
            sleep 5
            if ! adb shell pidof fr.lettra.app >/dev/null; then break; fi
            dossiers=$(adb shell ls "$data" 2>/dev/null | grep '\.lettra$' || true)
            if [ -n "$dossiers" ]; then break; fi
          done
          sleep 10
          adb exec-out screencap -p > artifacts/android-run/lettra-android.png
          adb logcat -d > artifacts/android-run/logcat.txt
          journal() { grep -E 'AndroidRuntime|monodroid|mono-rt|DOTNET|fr\.lettra|Lettra' artifacts/android-run/logcat.txt | tail -n 150; }
          if ! adb shell pidof fr.lettra.app >/dev/null; then echo "Lettra s'est arrêté au démarrage."; journal; exit 1; fi
          if grep -q 'FATAL EXCEPTION' artifacts/android-run/logcat.txt; then grep -A 30 'FATAL EXCEPTION' artifacts/android-run/logcat.txt; exit 1; fi
          if [ -z "$dossiers" ]; then echo "Aucun dossier local créé sous $data."; adb shell ls -lR /data/user/0/fr.lettra.app/files || true; journal; exit 1; fi
          echo "Processus : $(adb shell pidof fr.lettra.app)"
          echo "Dossiers locaux ($data) : $dossiers"
          EOF
      - name: Premier lancement sur l'émulateur (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash "$RUNNER_TEMP/lancement-android.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lettra-android-capture
          path: artifacts/android-run
          retention-days: 30

  maui-apple:
    name: MAUI iOS (simulateur) et macOS (Mac Catalyst)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Chaque version du SDK iOS de .NET exige sa version de Xcode : jeu de charges de travail épinglé (iOS et Mac
      # Catalyst 26.5, jeu 10.0.401) et Xcode 26.6 qu'il exige. À relever ensemble quand l'image aura le Xcode du SDK suivant.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Charge de travail MAUI (iOS, Mac Catalyst, Android)
        run: |
          dotnet --version
          dotnet workload install maui-ios maui-maccatalyst maui-android --version 10.0.401
      - name: Build iOS (simulateur)
        run: dotnet build src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-ios -r iossimulator-arm64
      # Premier lancement dans le simulateur : application vivante, premier dossier chiffré créé dans le dossier de
      # données de l'application (FileSystem.AppDataDirectory = Library du conteneur de données).
      - name: Premier lancement dans le simulateur iOS
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-run artifacts/lettra-ios-simulator
          app=$(find src/Hosts/Lettra.App.Maui/bin/Release/net10.0-ios -maxdepth 3 -name 'Lettra.App.Maui.app' -type d | head -n 1)
          echo "Application : $app"
          cp -R "$app" artifacts/lettra-ios-simulator/
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulateur : $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" fr.lettra.app
          data=$(xcrun simctl get_app_container "$udid" fr.lettra.app data)
          dossiers=""
          for _ in $(seq 1 24); do
            sleep 5
            dossiers=$(find "$data" -name '*.lettra' 2>/dev/null || true)
            if [ -n "$dossiers" ]; then break; fi
          done
          sleep 10
          xcrun simctl io "$udid" screenshot artifacts/ios-run/lettra-ios.png
          xcrun simctl spawn "$udid" log show --last 5m --predicate 'process == "Lettra.App.Maui"' > artifacts/ios-run/log.txt 2>&1 || true
          services=$(xcrun simctl spawn "$udid" launchctl list)
          if ! grep -q fr.lettra.app <<< "$services"; then echo "Lettra s'est arrêté au démarrage."; tail -n 80 artifacts/ios-run/log.txt; exit 1; fi
          if [ -z "$dossiers" ]; then echo "Aucun dossier local créé sous $data."; find "$data" -maxdepth 3; tail -n 80 artifacts/ios-run/log.txt; exit 1; fi
          echo "Dossiers locaux : $dossiers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lettra-ios-simulator
          path: artifacts/lettra-ios-simulator
          retention-days: 90
      # Apple Silicon seulement (la version universelle, avec Intel, double un build déjà long).
      - name: Build macOS (Mac Catalyst)
        run: dotnet build src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-maccatalyst -r maccatalyst-arm64
      # Application non signée : au premier lancement, macOS demande de l'ouvrir par clic droit > Ouvrir.
      # Sous Mac Catalyst, le Trousseau (clé du cabinet) exige une application signée par une équipe Apple Developer
      # (droit keychain-access-groups) : non signée, elle s'arrête à la création du premier dossier (MissingEntitlement).
      # Étape non bloquante tant que la CI n'a pas de certificat Apple ; elle redeviendra bloquante avec la signature.
      - name: Premier lancement sous macOS
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos-run artifacts/lettra-macos
          find src/Hosts/Lettra.App.Maui/bin/Release/net10.0-maccatalyst -maxdepth 4 -name '*.app' -type d
          app=$(find src/Hosts/Lettra.App.Maui/bin/Release/net10.0-maccatalyst -maxdepth 4 -name '*.app' -type d | head -n 1)
          echo "Application : $app"
          test -n "$app"
          ditto -c -k --keepParent "$app" artifacts/lettra-macos/Lettra-macos.zip
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          "$app/Contents/MacOS/$exe" > artifacts/macos-run/sortie.txt 2>&1 &
          pid=$!
          dossiers=""
          for _ in $(seq 1 24); do
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            dossiers=$(find "$HOME/Library" -maxdepth 6 -path '*dossiers/*.lettra' -not -path '*/Containers/com.apple.*' 2>/dev/null || true)
            if [ -n "$dossiers" ]; then break; fi
          done
          sleep 10
          screencapture -x artifacts/macos-run/lettra-macos.png || true
          if ! kill -0 "$pid" 2>/dev/null; then
            if grep -q MissingEntitlement artifacts/macos-run/sortie.txt; then
              echo "::warning::Mac Catalyst : Trousseau inaccessible sans signature Apple Developer (MissingEntitlement)."
            fi
            echo "Lettra s'est arrêté au démarrage."; tail -n 60 artifacts/macos-run/sortie.txt; exit 1
          fi
          if [ -z "$dossiers" ]; then echo "Aucun dossier local créé."; tail -n 60 artifacts/macos-run/sortie.txt; exit 1; fi
          echo "Dossiers locaux : $dossiers"
          kill "$pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lettra-macos
          path: artifacts/lettra-macos
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lettra-apple-captures
          path: |
            artifacts/ios-run
            artifacts/macos-run
          retention-days: 30

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Lettra.Ci.slnf
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lettra.cdx.json
          upload-artifact: true

  codeql:
    name: Analyse statique de sécurité (CodeQL)
    # CodeQL exige GitHub Advanced Security sur un dépôt privé : sinon, ce sont les analyseurs .NET
    # (règles de sécurité CA2xxx/CA3xxx, bloquantes au build) qui font office d'analyse statique.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build Lettra.Ci.slnf -c Release
      - uses: github/codeql-action/analyze@v3

  image:
    name: Image signée
    needs: [build-test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature sans clé (Sigstore, OIDC GitHub)
    strategy:
      matrix:
        include:
          - image: lettra-api
            dockerfile: Dockerfile
          - image: lettra-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:ci
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et publication
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Signature de l'image
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
