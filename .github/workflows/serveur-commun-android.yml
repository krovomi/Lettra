name: Serveur commun sur Android

# Serveur commun (docs/serveur-commun.md) de bout en bout sur un émulateur Android : la démo Docker tourne sur le runner,
# l'émulateur y accède par « adb reverse » (http://localhost:8080 et 8081, comme un téléphone branché par câble). Le
# navigateur crée un client ; l'application installée (APK de démonstration) est reliée au serveur par l'écran « Serveur
# du cabinet », se connecte (onglet du navigateur, mot de passe + code), voit ce client et en crée un ; le navigateur le
# retrouve.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'deploy/demo/**'
      - 'deploy/keycloak/**'
      - '.github/workflows/serveur-commun-android.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Sur une PR, un nouveau push annule l'exécution en cours. Sur main, chaque fusion garde son exécution complète (groupe
# par commit) : sinon les fusions rapprochées s'annulent et main n'a jamais de CI terminée.
concurrency:
  group: serveur-commun-android-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # SDK .NET épinglé : le SDK 10.0.403 (runtime 10.0.14) est annoncé par Microsoft mais ses fichiers ne se
  # téléchargent pas (HTTP 409), et sans version chaque job prend le dernier SDK. global.json reste ouvert
  # (10.0.100 et suivants) pour les postes de développement. À relever quand le SDK suivant s'installe.
  DOTNET_SDK_VERSION: 10.0.402

jobs:
  android:
    name: Navigateur et application Android sur les mêmes données
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPOSE: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml
      SORTIE: ${{ github.workspace }}/deploy/demo/e2e/sortie/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Charge de travail MAUI Android
        # Même jeu de charges de travail épinglé que ci.yml (MAUI_WORKLOAD_VERSION) : le jeu 10.0.402.1 ne s'installe pas
        # (manifeste iOS absent de nuget.org).
        run: dotnet workload install maui-android --version 10.0.401
      - name: Place sur le disque
        # La charge de travail MAUI, l'APK, les images de la démo et l'émulateur dépassent la place libre de la machine
        # (« no space left on device » en extrayant l'image Keycloak) : outils préinstallés dont ce job ne se sert pas.
        run: |
          df -h /
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/heroku /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          docker system prune -af --volumes > /dev/null
          df -h /
      - name: Build de l'APK de démonstration
        run: dotnet publish src/Hosts/Lettra.App.Maui/Lettra.App.Maui.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory=$ANDROID_HOME -o artifacts/lettra-android

      - name: Démo (localhost)
        run: |
          $COMPOSE build
          # Cache de build Docker inutile une fois les images faites : sa place revient à l'émulateur.
          docker builder prune -af > /dev/null
          df -h /
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright (Chromium)
        working-directory: deploy/demo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Pilote de l'appareil (APK installé sur l'émulateur par Playwright _android).
          npx playwright install android
      - name: Navigateur — enrôlement TOTP et client
        working-directory: deploy/demo/e2e
        run: |
          set -a; . ../.env; set +a
          node parcours.mjs premier

      - name: Accélération matérielle de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Script de l'appareil
        run: |
          cat > "$RUNNER_TEMP/serveur-commun-android.sh" <<'EOF'
          set -euo pipefail
          cd deploy/demo/e2e
          set -a; . ../.env; set +a
          mkdir -p "$SORTIE/android"
          adb reverse tcp:8080 tcp:8080
          adb reverse tcp:8081 tcp:8081
          adb shell pm list packages | grep -iE 'chrome|browser|webview' || true
          adb install -r "$(ls ../../../artifacts/lettra-android/*-Signed.apk | head -n 1)"
          adb logcat -c
          status=0
          node android.mjs "$(cat "$SORTIE/client.txt")" || status=$?
          # Un émulateur tombé laisse adb attendre l'appareil sans fin (jusqu'au délai du job) : chaque appel est borné.
          timeout 60 adb logcat -d > "$SORTIE/android/logcat.txt" || true
          if [ "$status" != 0 ]; then
            # L'appareil est-il encore là ? Sinon, la mémoire de la machine (OOM) est la première piste.
            echo "adb : $(timeout 10 adb get-state 2>&1 || echo 'appareil perdu')"
            pgrep -a -f 'qemu-system|emulator' | cut -c1-160 || echo "processus de l'émulateur : aucun"
            free -m
            sudo dmesg | grep -iE 'out of memory|oom-kill|killed process|segfault|qemu' | tail -n 20 || true
            # Journal du noyau de la machine (OOM, signaux) et rapports de plantage de l'émulateur, place disque.
            sudo journalctl -k --no-pager -q --since '-15 min' | grep -iE 'oom|kill|qemu|segfault|out of memory' | tail -n 20 || true
            ls -laR /tmp/android-runner 2>/dev/null | tail -n 30 || true
            df -h / | tail -n 1
            # Un émulateur qui plante laisse un rapport (minidump) : on liste ceux trouvés.
            find /tmp ~/.android -name '*.dmp' -newer "$SORTIE/client.txt" 2>/dev/null | head -n 10 || true
            grep -E 'AndroidRuntime|monodroid|mono-rt|DOTNET|fr\.lettra|Lettra|ActivityTaskManager: (START|Displayed)|com\.android\.chrome|cr_' "$SORTIE/android/logcat.txt" | grep -vE 'SandboxedProcessService|CronetUrlRequestContext' | tail -n 150 || true
            exit "$status"
          fi
          node appareil.mjs voir "$(cat "$SORTIE/client-appareil.txt")"
          EOF
      - name: Émulateur (API 34) — appareil relié au serveur commun
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Écran de téléphone courant (1080×2340), pas le 320×640 par défaut.
          profile: pixel_5
          disable-animations: true
          # Partition de données de 4 Go au lieu de 6 : l'émulateur refusait de démarrer faute de place
          # (« Not enough space to create userdata partition »), la démo et l'APK occupant déjà le disque.
          disk-size: 4096M
          # Émulateur 37.2.12 figé : avec 37.2.13, l'émulateur lui-même disparaissait juste après la connexion,
          # en ouvrant la liste des clients, sans message ni manque de mémoire. À relever quand une version plus
          # récente passe ce test.
          emulator-build: 16428233
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -no-snapshot -show-kernel
          script: bash "$RUNNER_TEMP/serveur-commun-android.sh"

      - name: Journaux de la démo
        if: always()
        run: $COMPOSE logs --no-color > "$SORTIE/compose.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serveur-commun-android
          path: deploy/demo/e2e/sortie/android
          retention-days: 7
