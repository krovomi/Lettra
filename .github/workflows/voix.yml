name: Voix

# Dictée et commandes vocales (vague 5, lane D) face à un vrai Whisper : un corpus de phrases lues par une voix de
# synthèse (Piper), commité dans tests/Lettra.Speech.Tests/Corpus/wav, passe par Whisper.net (le moteur du poste, sur
# Linux, Windows et macOS) et par le serveur whisper.cpp (le moteur de la cellule, en conteneur). Le rapport (erreurs
# de mots, commandes reconnues) s'affiche dans le résumé du run. Le corpus n'est pas relu à chaque run : Piper tire du
# bruit au hasard et ses échantillons varient d'un processeur à l'autre, si bien que le score bougeait sans changement
# de code. La CI vérifie ses empreintes ; build/voix/corpus.sh le régénère à la main. Séparé de « CI » : le modèle
# pèse 142 Mio et ne sert qu'aux changements de la voix.

on:
  push:
    branches: [main]
    paths:
      - src/Core/Lettra.Speech/**
      - src/Core/Lettra.Application/Abstractions/Speech/**
      - src/Core/Lettra.Application/Features/Speech/**
      - src/Infrastructure/Lettra.Infrastructure.Speech/**
      - src/Infrastructure/Lettra.Infrastructure.Speech.OnDevice/**
      - tests/Lettra.Speech.Tests/**
      - build/voix/**
      - Directory.Packages.props
      - .github/workflows/voix.yml
  pull_request:
    paths:
      - src/Core/Lettra.Speech/**
      - src/Core/Lettra.Application/Abstractions/Speech/**
      - src/Core/Lettra.Application/Features/Speech/**
      - src/Infrastructure/Lettra.Infrastructure.Speech/**
      - src/Infrastructure/Lettra.Infrastructure.Speech.OnDevice/**
      - tests/Lettra.Speech.Tests/**
      - build/voix/**
      - Directory.Packages.props
      - .github/workflows/voix.yml
  workflow_dispatch:
    inputs:
      model:
        description: Modèle Whisper (tiny, base, small)
        default: base

permissions:
  contents: read

concurrency:
  group: voix-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  WHISPER_MODEL: ${{ inputs.model || 'base' }}

jobs:
  corpus:
    name: Corpus et modèle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Le même corpus à chaque run : un WAV par phrase de phrases.json, chacun avec le SHA-256 de corpus.sha256.
      - name: Corpus commité vérifié
        run: build/voix/corpus-verifier.sh

      - name: Modèle en cache
        uses: actions/cache@v4
        with:
          path: voix/models
          key: whisper-ggml-${{ env.WHISPER_MODEL }}

      # Empreinte SHA-1 publiée par whisper.cpp vérifiée ; le SHA-256 affiché sert à l'épingler.
      - name: Modèle Whisper vérifié
        run: build/voix/model.sh "$WHISPER_MODEL" voix/models

      - uses: actions/upload-artifact@v4
        with:
          name: voix-modele
          path: voix/models
          retention-days: 3

  whisper-net:
    name: Whisper.net sur le poste (${{ matrix.os }})
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: voix-modele
          path: voix/models

      - name: Corpus face à Whisper.net
        run: >
          dotnet test tests/Lettra.Speech.Tests -c Release
          --logger "console;verbosity=normal"
        env:
          LETTRA_VOICE_CORPUS: ${{ github.workspace }}/tests/Lettra.Speech.Tests/Corpus/wav
          LETTRA_WHISPER_MODEL: ${{ github.workspace }}/voix/models/ggml-${{ env.WHISPER_MODEL }}.bin

  whisper-server:
    name: Serveur whisper.cpp de la cellule
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: voix-modele
          path: voix/models

      # Même image que le conteneur « whisper » de la démonstration : build/voix/whisper-server.
      - name: Serveur whisper.cpp
        run: |
          docker build -t lettra-whisper build/voix/whisper-server
          docker run -d --name whisper -p 8178:8080 -e WHISPER_MODEL="$WHISPER_MODEL" -v "$PWD/voix/models:/models:ro" lettra-whisper
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8178/; then echo "Serveur prêt"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' whisper)" != "true" ]; then break; fi
            sleep 2
          done
          docker inspect -f 'Arrêté : code {{.State.ExitCode}}, mémoire épuisée {{.State.OOMKilled}}' whisper
          docker logs whisper
          exit 1

      - name: Corpus face au serveur
        run: dotnet test tests/Lettra.Speech.Tests -c Release --logger "console;verbosity=normal"
        env:
          LETTRA_VOICE_CORPUS: ${{ github.workspace }}/tests/Lettra.Speech.Tests/Corpus/wav
          LETTRA_WHISPER_SERVER: http://localhost:8178/

      - name: Journaux du serveur
        if: failure()
        run: docker logs whisper

  amorcage:
    name: Amorçage du corpus (lecture seule)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg flac
          python -m pip install -r build/voix/piper-requirements.txt
      - run: build/voix/corpus.sh voix/voices
        env:
          PIPER_PYTHON: python
      - run: |
          mkdir -p /tmp/f
          for w in tests/Lettra.Speech.Tests/Corpus/wav/*.wav; do flac -s --best -o /tmp/f/$(basename "$w" .wav).flac "$w"; done
          tar -C /tmp/f -cf - . | base64 -w0 > /tmp/b64
          split -b 60000 -d -a 2 /tmp/b64 /tmp/part.
          du -sb tests/Lettra.Speech.Tests/Corpus/wav /tmp/f
          echo "::notice title=taille::$(wc -c < /tmp/b64) $(ls /tmp/part.* | wc -l) $(sha256sum < /tmp/b64)"
          echo "::notice title=manifeste::$(sed ':a;N;$!ba;s/\n/%0A/g' tests/Lettra.Speech.Tests/Corpus/corpus.sha256)"
      - run: for p in /tmp/part.0?; do [ -f "$p" ] && echo "::notice title=${p#/tmp/}::$(cat "$p")"; done; true
      - run: for p in /tmp/part.1?; do [ -f "$p" ] && echo "::notice title=${p#/tmp/}::$(cat "$p")"; done; true
      - run: for p in /tmp/part.2?; do [ -f "$p" ] && echo "::notice title=${p#/tmp/}::$(cat "$p")"; done; true
      - run: for p in /tmp/part.3?; do [ -f "$p" ] && echo "::notice title=${p#/tmp/}::$(cat "$p")"; done; true
      - run: for p in /tmp/part.4?; do [ -f "$p" ] && echo "::notice title=${p#/tmp/}::$(cat "$p")"; done; true
