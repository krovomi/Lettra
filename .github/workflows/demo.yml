name: Démo navigateur

# La démonstration de deploy/demo, de bout en bout dans Chromium : Keycloak + API + PWA, connexion avec
# enrôlement TOTP, écran et création de client, manifeste et service worker ; puis le profil HTTPS du réseau local.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml
  COMPOSE_LAN: docker compose -f ${{ github.workspace }}/deploy/demo/compose.yaml -f ${{ github.workspace }}/deploy/demo/compose.lan.yaml
  SORTIE: ${{ github.workspace }}/deploy/demo/e2e/sortie

jobs:
  demo-navigateur:
    name: Démo navigateur (Keycloak + API + PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Construction de l'image de l'API
        run: $COMPOSE build

      - name: Démarrage (localhost)
        run: |
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          curl -sf http://localhost:8081/realms/lettra/.well-known/openid-configuration | jq -r .issuer

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Playwright (Chromium)
        working-directory: deploy/demo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Première connexion (enrôlement TOTP), client, PWA, seconde connexion
        working-directory: deploy/demo/e2e
        run: |
          set -a; . ../.env; set +a
          SORTIE="$SORTIE/localhost" node parcours.mjs premier

      - name: Redémarrage de la pile, connexion mot de passe + code, données conservées
        working-directory: deploy/demo/e2e
        run: |
          $COMPOSE down
          $COMPOSE up -d --wait
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          set -a; . ../.env; set +a
          SORTIE="$SORTIE/localhost" node parcours.mjs suivant

      - name: Profil réseau local (HTTPS, nom d'hôte hors localhost)
        env:
          LETTRA_DEMO_HOST: lettra-demo.test
        run: |
          echo "127.0.0.1 lettra-demo.test" | sudo tee -a /etc/hosts
          $COMPOSE_LAN up -d --wait --remove-orphans
          timeout 120 bash -c 'until curl -sf -o "$RUNNER_TEMP/ca.crt" http://localhost:8079/lettra-demo-ca.crt; do sleep 2; done'
          openssl x509 -in "$RUNNER_TEMP/ca.crt" -noout -subject
          timeout 180 bash -c 'until curl -sf --cacert "$RUNNER_TEMP/ca.crt" https://lettra-demo.test:8443/health; do sleep 2; done'
          # Le certificat racine approuvé comme sur un téléphone : base NSS de Chromium.
          sudo apt-get install -y -qq libnss3-tools > /dev/null
          mkdir -p "$HOME/.pki/nssdb"
          [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n lettra-demo -i "$RUNNER_TEMP/ca.crt"

      - name: Parcours en HTTPS (https://lettra-demo.test:8443)
        working-directory: deploy/demo/e2e
        env:
          LETTRA_URL: https://lettra-demo.test:8443
        run: |
          set -a; . ../.env; set +a
          SORTIE="$SORTIE/reseau-local" node parcours.mjs premier

      - name: Journaux
        if: always()
        env:
          LETTRA_DEMO_HOST: lettra-demo.test
        run: |
          mkdir -p "$SORTIE"
          $COMPOSE_LAN ps -a > "$SORTIE/compose-ps.txt" 2>&1 || true
          for s in keycloak api proxy; do $COMPOSE_LAN logs --no-color "$s" > "$SORTIE/$s.log" 2>&1 || true; done

      - name: Captures, traces et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-navigateur
          path: deploy/demo/e2e/sortie/
          if-no-files-found: warn

      - name: Arrêt
        if: always()
        env:
          LETTRA_DEMO_HOST: lettra-demo.test
        run: $COMPOSE_LAN down -v
