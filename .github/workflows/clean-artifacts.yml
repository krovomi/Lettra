name: Purge des Artefacts

on:
  workflow_dispatch: # Permet de lancer le nettoyage manuellement d'un simple clic
  schedule:
    - cron: '0 0 * * *' # S'exécute automatiquement toutes les nuits à minuit

jobs:
  clean-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Requis pour avoir le droit de supprimer les artefacts et les caches

    steps:
      - name: Supprimer tous les artefacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = "krovomi";
            const repo = "Lettra";

            // paginate parcourt toutes les pages : sans lui, seuls les 100 premiers artefacts sont supprimés
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });

            if (artifacts.length === 0) {
              console.log("Aucun artefact à supprimer.");
            } else {
              console.log(`Trouvé ${artifacts.length} artefact(s). Suppression en cours...`);
              for (const artifact of artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                console.log(`Artefact ${artifact.id} (${artifact.name}) supprimé.`);
              }
            }

      # Les caches (ex. modèles Whisper de voix.yml) comptent aussi dans le quota de stockage Actions.
      - name: Supprimer tous les caches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = "krovomi";
            const repo = "Lettra";

            const caches = await github.paginate(github.rest.actions.getActionsCacheList, { owner, repo, per_page: 100 });

            if (caches.length === 0) {
              console.log("Aucun cache à supprimer.");
            } else {
              console.log(`Trouvé ${caches.length} cache(s). Suppression en cours...`);
              for (const cache of caches) {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id,
                });
                console.log(`Cache ${cache.id} (${cache.key}) supprimé.`);
              }
            }
