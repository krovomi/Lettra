# Journaux techniques (annexe G §3) : 30 jours, ingestion OTLP depuis le collecteur filtrant.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: s3
  # Stockage objet de la cellule (même hébergeur, même région), renseigné par cellule.
  storage:
    type: s3
singleBinary:
  replicas: 1
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
