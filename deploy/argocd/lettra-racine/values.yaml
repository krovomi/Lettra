# Installé par OpenTofu (module cell-bootstrap) ; ensuite, tout changement passe par une PR sur ce dépôt.
cell: recette
size: S
repoURL: https://github.com/krovomi/Lettra.git
revision: main
project: lettra

namespaces:
  lettra: lettra
  observabilite: lettra-observabilite
  operateurs: cnpg-system

# Versions des charts tiers, montées par PR (Renovate) et relues comme du code.
charts:
  cloudnativePg: { repoURL: https://cloudnative-pg.github.io/charts, chart: cloudnative-pg, version: 0.29.1 }
  kubePrometheusStack: { repoURL: https://prometheus-community.github.io/helm-charts, chart: kube-prometheus-stack, version: 92.7.0 }
  loki: { repoURL: https://grafana.github.io/helm-charts, chart: loki, version: 7.3.0 }
  tempo: { repoURL: https://grafana.github.io/helm-charts, chart: tempo, version: 1.24.4 }

# Image des applications Lettra : SHA du commit signé par la CI (cosign), jamais latest.
imageTag: ""

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
