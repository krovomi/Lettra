# CI SEULEMENT (deploy/tests/kind/essai-keycloak.sh, job « keycloak-kind » de .github/workflows/deploy.yml).
# Cellule réduite dans un cluster kind jetable : Keycloak (realm versionné, base CloudNativePG) et l'API qui le vérifie.
# Ne jamais utiliser pour une vraie cellule : adresses localhost, une instance, ni Worker ni clusters de dossiers.
# Aucun secret ici : le script tire au hasard ceux de lettra-keycloak et lettra-api à chaque essai.
cell: ci-kind
environment: ci

lettra-api:
  cell: ci-kind
  environment: ci
  image:
    repository: ghcr.io/krovomi/lettra-api
    tag: ci-kind  # construite par le job puis chargée dans kind
  # oidc.authority : valeur commune de lettra-cell, http://keycloak:8080/realms/lettra (Keycloak de la cellule).
  secretEnv:
    ConnectionStrings__Redis: { secret: "" }
    LETTRA_PG_A_PASSWORD: { secret: "" }
    Lettra__Kms__Transit__Token: { secret: "" }  # ni de KMS : KEK déclarées dans la configuration
  aspnetcoreEnvironment: Production
  autoscaling: { enabled: false }
  replicas: 1
  podDisruptionBudget: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  # Comme un environnement de PR : mode 2, catalogue et dossier SQLite dans un volume éphémère.
  settings:
    Lettra__DeploymentMode: LocalNetwork
    Lettra__Observability__ServiceName: lettra-api
    # Réglages PostgreSQL des valeurs communes retirés : catalogue SQLite.
    Lettra__Catalog__Provider: null
    ConnectionStrings__Catalog: Data Source=/data/lettra-catalogue.db
    Lettra__Clusters__pg-a__Provider: null
    Lettra__Clusters__pg-a__ConnectionString: null
    Lettra__Clusters__pg-a__AdminConnectionString: null
    Lettra__Clusters__pg-a__CabinetRoles: null
    Lettra__Kms__Provider: null
    Lettra__Kms__Transit__Address: null
    ConnectionStrings__DossierDemo: Data Source=/data/lettra-dossier-demo.db
    # Clés DataProtection (état OIDC du BFF) dans le volume : le système de fichiers de l'image est en lecture seule.
    HOME: /data
  extraVolumes:
    - name: data
      emptyDir: { sizeLimit: 1Gi }
  extraVolumeMounts:
    - { name: data, mountPath: /data }

lettra-worker:
  enabled: false
postgres:
  enabled: false
redis:
  enabled: false

lettra-keycloak:
  cell: ci-kind
  environment: ci
  # Émetteur vu depuis le poste de la CI (redirection de port) ; l'API, elle, passe par le Service interne.
  hostname: http://localhost:8080
  publicUrl: http://localhost:8081
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  database:
    cnpg:
      instances: 1
      storage: 1Gi
      monitoring: false  # pas de Prometheus Operator dans kind
