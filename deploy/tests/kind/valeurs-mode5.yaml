# CI SEULEMENT (deploy/tests/kind/essai-mode5.sh, job « mode5-kind » de .github/workflows/deploy.yml).
# Cellule en mode 5 (HostedSaaS) dans un cluster kind jetable : Keycloak, l'API et le Worker, catalogue et bases des
# dossiers sur un cluster PostgreSQL CloudNativePG derrière PgBouncer, clés des cabinets dans le moteur Transit
# d'OpenBao, exactement comme les valeurs communes de lettra-cell. Ce qui diffère d'une vraie cellule : une instance de
# chaque, OpenBao en mode « dev » (openbao-essai.yaml), adresses localhost, pas de Redis ni de Prometheus Operator,
# Worker pressé (une passe toutes les 20 s) et second facteur non exigé (voir plus bas).
# Aucun secret ici : le script tire au hasard ceux de lettra-keycloak, lettra-api, lettra-worker et lettra-kms (dont le
# secret du compte de service lettra-provisioning, qu'il installe dans Keycloak).
cell: ci-kind
environment: ci

lettra-api:
  cell: ci-kind
  environment: ci
  image:
    repository: ghcr.io/krovomi/lettra-api
    tag: ci-kind  # construite par le job puis chargée dans kind
  secretEnv:
    ConnectionStrings__Redis: { secret: "" }
  aspnetcoreEnvironment: Production
  autoscaling: { enabled: false }
  replicas: 1
  podDisruptionBudget: { enabled: false }
  # L'essai appelle l'API par une redirection de port, hors de la passerelle de la cellule.
  networkPolicy: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  settings:
    Lettra__DeploymentMode: HostedSaaS
    Lettra__Clusters__pg-a__CellId: ci-kind
    # Le script obtient un jeton par mot de passe (client d'essai lettra-essai) : Keycloak n'y prouve pas de second
    # facteur. Le flux navigateur, lui, l'exige toujours (vérifié par essai-keycloak.sh).
    Lettra__Identity__Oidc__RequireMfa: "false"
    # Délai de rétractation d'un effacement de dossier : 15 s au lieu de 30 jours, pour que l'essai le voie aboutir.
    Lettra__Catalog__DossierErasureDelay: "00:00:15"
    # Délai avant le départ d'un cabinet : 15 s au lieu de 30 jours.
    Lettra__Catalog__CabinetDepartureDelay: "00:00:15"
    # Attente par l'API d'une création menée par le Worker : 10 s au lieu de 60, l'essai arrête le Worker à l'étape 5.
    Lettra__Catalog__ProvisioningWait: "00:00:10"
    # Clés DataProtection (état OIDC du BFF) dans un volume : le système de fichiers de l'image est en lecture seule.
    HOME: /data
  extraVolumes:
    - name: data
      emptyDir: { sizeLimit: 256Mi }
  extraVolumeMounts:
    - { name: data, mountPath: /data }

lettra-worker:
  cell: ci-kind
  environment: ci
  image:
    repository: ghcr.io/krovomi/lettra-worker
    tag: ci-kind
  settings:
    Lettra__Clusters__pg-a__CellId: ci-kind
    # Une passe toutes les 20 s : migration du catalogue puis reprise des créations de dossiers interrompues.
    Lettra__Worker__Interval: "00:00:20"
    # Réenveloppement des KEK après une rotation de clé racine : toutes les 20 s au lieu d'une fois par jour.
    Lettra__Worker__KeyRewrap__InitialDelay: "00:00:05"
    Lettra__Worker__KeyRewrap__Interval: "00:00:20"
    # Effacement des dossiers dont le délai de rétractation est passé : toutes les 10 s au lieu d'une fois par heure.
    Lettra__DossierErasure__InitialDelay: "00:00:05"
    Lettra__DossierErasure__Interval: "00:00:10"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

lettra-keycloak:
  cell: ci-kind
  environment: ci
  # Émetteur vu depuis le poste de la CI (redirection de port) ; l'API, elle, passe par le Service interne.
  hostname: http://localhost:8080
  publicUrl: http://localhost:8081
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  database:
    cnpg:
      instances: 1
      storage: 1Gi
      monitoring: false  # pas de Prometheus Operator dans kind

postgres:
  monitoring: false
  clusters:
    - { name: pg-a, instances: 1, storage: 2Gi, activeDossierBudget: 10 }
  pooler:
    instances: 1

redis:
  enabled: false
