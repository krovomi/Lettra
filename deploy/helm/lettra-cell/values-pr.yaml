# Environnement éphémère d'une pull request (annexe E §4 et §7) : créé quand la PR porte l'étiquette env:pr,
# détruit à sa fermeture. Données synthétiques seulement.
# L'API y tourne comme en développement : mode 2, catalogue et dossier de démonstration SQLite dans un volume éphémère,
# sans cluster PostgreSQL. Le mode 5 lui-même est essayé dans kind (deploy/tests/kind/essai-mode5.sh) ; passer les
# environnements de PR en mode 5 attend la cellule de recette (docs/plan-mode-5.md, étape 4).
environment: pr
lettra-api:
  environment: pr
  oidc:
    authority: https://auth.recette.lettra.fr/realms/lettra  # Keycloak de la recette, partagé par les PR
    requireHttpsMetadata: true  # hors de la cellule de l'environnement : par son adresse publique, en HTTPS
  existingSecret: ""
  secretEnv:
    ConnectionStrings__Redis: { secret: "" }  # pas de Redis dans un environnement de PR
    LETTRA_PG_A_PASSWORD: { secret: "" }  # ni de cluster PostgreSQL
    Lettra__Kms__Transit__Token: { secret: "" }  # ni de KMS : KEK déclarées dans la configuration
  aspnetcoreEnvironment: Development
  autoscaling: { enabled: false }
  replicas: 1
  podDisruptionBudget: { enabled: false }
  networkPolicy: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  settings:
    Lettra__DeploymentMode: LocalNetwork
    Lettra__Observability__ServiceName: lettra-api
    # Réglages PostgreSQL des valeurs communes retirés : catalogue SQLite (valeur par défaut de l'API).
    Lettra__Catalog__Provider: null
    ConnectionStrings__Catalog: Data Source=/data/lettra-catalogue.db
    Lettra__Clusters__pg-a__Provider: null
    Lettra__Clusters__pg-a__ConnectionString: null
    Lettra__Clusters__pg-a__AdminConnectionString: null
    Lettra__Clusters__pg-a__CabinetRoles: null
    Lettra__Kms__Provider: null
    Lettra__Kms__Transit__Address: null
    ConnectionStrings__DossierDemo: Data Source=/data/lettra-dossier-demo.db
  extraVolumes:
    - name: data
      emptyDir: { sizeLimit: 1Gi }
  extraVolumeMounts:
    - { name: data, mountPath: /data }
lettra-worker:
  enabled: false
lettra-keycloak:
  enabled: false  # Keycloak de la recette
postgres:
  enabled: false
redis:
  enabled: false
