{{- if .Values.postgres.enabled }}
{{- range $cluster := .Values.postgres.clusters }}
{{- if gt (int $cluster.activeDossierBudget) (int $.Values.postgres.maxActiveDossiersPerCluster) }}
{{- fail (printf "%s : %d dossiers actifs dépassent le maximum par cluster (%d). Ajouter un cluster." $cluster.name (int $cluster.activeDossierBudget) (int $.Values.postgres.maxActiveDossiersPerCluster)) }}
{{- end }}
{{- $perPooler := include "lettra-cell.perPoolerBudget" (dict "cluster" $cluster "root" $) | int }}
{{- $maxConnections := add (mul $perPooler (int $.Values.postgres.pooler.instances)) (int $.Values.postgres.reservedConnections) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster.name }}
  labels:
    {{- include "lettra-cell.labels" $ | nindent 4 }}
  annotations:
    lettra.fr/active-dossier-budget: {{ $cluster.activeDossierBudget | quote }}
spec:
  instances: {{ $cluster.instances }}
  imageName: {{ $.Values.postgres.image }}
  primaryUpdateStrategy: unsupervised
  # Rôle applicatif de Lettra (secret {{ $cluster.name }}-app, créé par l'opérateur) et sa base, qui porte le catalogue
  # sur le cluster désigné par postgres.catalogCluster. Ce rôle ne crée ni base ni rôle : l'API qui s'en sert n'a aucun
  # droit d'administration. Les connexions réservées lui sont ouvertes : le trafic des cabinets ne peut pas priver le
  # catalogue de connexion.
  bootstrap:
    initdb:
      database: {{ $.Values.postgres.database }}
      owner: {{ $.Values.postgres.database }}
      postInitSQL:
        - GRANT pg_use_reserved_connections TO {{ $.Values.postgres.database }}
  # Rôle d'administration, réservé au Worker (connexion directe au primaire) : Lettra crée lui-même une base par dossier
  # (ADR-0009), d'où CREATEDB, et chaque cabinet a son propre rôle de connexion, seul admis sur ses bases
  # (Lettra:Clusters:<cluster>:CabinetRoles), d'où CREATEROLE. Les connexions réservées lui sont ouvertes aussi : les
  # créations de bases et les migrations du Worker passent même quand les cabinets prennent tout le budget. Membre du
  # rôle applicatif, il reprend aussi les bases et les rôles que celui-ci a créés sur une cellule d'avant ce partage.
  managed:
    roles:
      - name: {{ $.Values.postgres.adminRole }}
        ensure: present
        login: true
        createdb: true
        createrole: true
        inRoles: [pg_use_reserved_connections, {{ $.Values.postgres.database }}]
        passwordSecret:
          name: {{ $cluster.name }}-admin
  postgresql:
    parameters:
      # Budget des dossiers actifs servis par PgBouncer + connexions réservées.
      max_connections: {{ $maxConnections | quote }}
      # Les connexions gardées hors du budget, moins les 3 du superutilisateur (superuser_reserved_connections).
      reserved_connections: {{ sub (int $.Values.postgres.reservedConnections) 3 | quote }}
      shared_buffers: 512MB
      log_min_duration_statement: "1000"
      # Aucune valeur de paramètre dans les journaux (données de dossier).
      log_parameter_max_length: "0"
      log_parameter_max_length_on_error: "0"
  storage:
    size: {{ $cluster.storage }}
    {{- with $.Values.postgres.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  monitoring:
    enablePodMonitor: {{ $.Values.postgres.monitoring }}
  affinity:
    topologyKey: topology.kubernetes.io/zone
  {{- if $.Values.postgres.backup.enabled }}
  backup:
    retentionPolicy: {{ $.Values.postgres.backup.retention | quote }}
    barmanObjectStore:
      destinationPath: {{ printf "%s/%s" $.Values.postgres.backup.destinationPath $cluster.name | quote }}
      endpointURL: {{ $.Values.postgres.backup.endpointURL | quote }}
      s3Credentials:
        accessKeyId: { name: {{ $.Values.postgres.backup.credentialsSecret }}, key: ACCESS_KEY_ID }
        secretAccessKey: { name: {{ $.Values.postgres.backup.credentialsSecret }}, key: ACCESS_SECRET_KEY }
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  # Pas « {{ $cluster.name }}-rw » : ce nom est déjà celui du Service que l'opérateur crée pour le primaire du cluster.
  name: {{ $cluster.name }}-pooler
  labels:
    {{- include "lettra-cell.labels" $ | nindent 4 }}
spec:
  cluster:
    name: {{ $cluster.name }}
  instances: {{ $.Values.postgres.pooler.instances }}
  type: rw
  monitoring:
    enablePodMonitor: {{ $.Values.postgres.monitoring }}
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ $.Values.postgres.pooler.maxClientConn | quote }}
      default_pool_size: {{ $.Values.postgres.pooler.defaultPoolSize | quote }}
      min_pool_size: "0"
      reserve_pool_size: "0"
      # Plafond de connexions serveur de cette instance pour un même rôle : le budget du cluster pour le rôle partagé,
      # et, avec les rôles par cabinet, ce qu'un seul cabinet peut prendre. Le plafond de l'ensemble est alors
      # max_connections, dont les connexions réservées restent au rôle applicatif de Lettra.
      max_user_connections: {{ $perPooler | quote }}
      server_idle_timeout: {{ $.Values.postgres.pooler.serverIdleTimeout | quote }}
      max_prepared_statements: {{ $.Values.postgres.pooler.maxPreparedStatements | quote }}
      ignore_startup_parameters: extra_float_digits
{{- if $.Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $cluster.name }}-quotidienne
  labels:
    {{- include "lettra-cell.labels" $ | nindent 4 }}
spec:
  schedule: {{ $.Values.postgres.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $cluster.name }}
{{- end }}
{{- end }}
{{- end }}
