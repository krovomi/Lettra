# Valeurs communes à toutes les cellules. La taille vient de values-taille-<S|M|L|XL>.yaml, l'identité de la cellule
# de deploy/cells/<cellule>/values.yaml.
cell: local
environment: development

lettra-api:
  cell: local
  existingSecret: lettra-api
  # Keycloak de la cellule (lettra-keycloak), joint par son Service interne. L'émetteur des jetons reste l'adresse
  # publique (lettra-keycloak.hostname) : Keycloak la publie dans sa découverte et l'API la vérifie dans chaque jeton.
  # HTTP sans TLS seulement dans la cellule, borné par la NetworkPolicy de Keycloak.
  oidc:
    authority: http://keycloak:8080/realms/lettra
    requireHttpsMetadata: false
  # Mode 5 : catalogue et bases des dossiers sur les clusters PostgreSQL de la cellule (postgres.clusters ci-dessous).
  secretEnv: &bases-secrets
    # Mot de passe du rôle applicatif, créé par l'opérateur CloudNativePG ; repris dans les chaînes ci-dessous ($(…)).
    LETTRA_PG_A_PASSWORD: { secret: pg-a-app, key: password }
    # Jeton du KMS de la cellule (moteur Transit d'OpenBao), posé par l'exploitation : jamais dans Git.
    Lettra__Kms__Transit__Token: { secret: lettra-kms, key: token }
  settings: &bases-reglages
    Lettra__Catalog__Provider: PostgreSql
    # Catalogue : base initiale de pg-a, par PgBouncer.
    ConnectionStrings__Catalog: Host=pg-a-pooler;Database=lettra;Username=lettra;Password=$(LETTRA_PG_A_PASSWORD);No Reset On Close=true
    # Bases des dossiers : connexion applicative par PgBouncer, CREATE / DROP DATABASE en direct sur le primaire.
    Lettra__Clusters__pg-a__Provider: PostgreSql
    Lettra__Clusters__pg-a__ConnectionString: Host=pg-a-pooler;Username=lettra;Password=$(LETTRA_PG_A_PASSWORD);No Reset On Close=true
    Lettra__Clusters__pg-a__AdminConnectionString: Host=pg-a-rw;Username=lettra;Password=$(LETTRA_PG_A_PASSWORD)
    # Clés des cabinets (ADR-0011) : une clé racine par cabinet dans le moteur Transit du KMS de la cellule, la KEK
    # gardée enveloppée dans le catalogue. Le Worker réenveloppe chaque jour après les rotations automatiques.
    Lettra__Kms__Provider: Transit
    Lettra__Kms__Transit__Address: http://openbao:8200/
    # Arrivée et départ des cabinets par l'administrateur de la plateforme : le compte de service lettra-provisioning
    # (rôles du client realm-management) crée l'organisation et le compte de l'administrateur du cabinet, puis les
    # supprime au départ. Son secret, Lettra__Identity__Provisioning__ClientSecret, est posé par l'exploitation dans
    # les secrets lettra-api et lettra-worker ; sans lui, la plateforme refuse d'inscrire un cabinet.
    Lettra__Identity__Provisioning__Authority: http://keycloak:8080/realms/lettra
    Lettra__Identity__Provisioning__ClientId: lettra-provisioning
lettra-worker:
  enabled: true
  cell: local
  existingSecret: lettra-worker
  secretEnv: *bases-secrets
  settings: *bases-reglages

# Keycloak de la cellule (chart lettra-keycloak) : realm lettra versionné, une organisation par cabinet, MFA
# obligatoire, base PostgreSQL dédiée. Adresses publiques renseignées par cellule (deploy/cells/<cellule>/values.yaml).
lettra-keycloak:
  enabled: true
  cell: local
  hostname: https://auth.lettra.fr
  publicUrl: https://app.lettra.fr
  # Secret existant (créé par OpenTofu, module cell-bootstrap) : clés « admin-password » et « bff-client-secret ».
  existingSecret: lettra-keycloak

# Bases des dossiers : une base par dossier, hébergée sur des clusters PostgreSQL (CloudNativePG) derrière PgBouncer.
postgres:
  enabled: true
  image: ghcr.io/cloudnative-pg/postgresql:16.10
  storageClass: ""
  # Règle de dimensionnement issue du POC « base par dossier » (ADR-0009, amendement) : PgBouncer garde un pool par
  # couple (base, utilisateur) et ne partage rien entre bases. Le budget de connexions serveur doit donc couvrir le
  # nombre de dossiers ACTIFS au même moment (pas le nombre de bases, ni d'utilisateurs).
  # 2 500 bases inactives coûtent < 1 % de CPU ; au-delà du budget, la latence décroche (5 s à 2 500 actifs pour 120).
  # Rôle applicatif et base initiale de chaque cluster (secret <cluster>-app, créé par l'opérateur CloudNativePG). La
  # base initiale de pg-a porte le catalogue et la supervision (réglages de lettra-api et lettra-worker ci-dessus).
  database: lettra
  # PodMonitor de chaque cluster et de son PgBouncer (Prometheus Operator de la cellule).
  monitoring: true
  clusters:
    - name: pg-a
      instances: 2
      storage: 20Gi
      # Dossiers actifs simultanément que ce cluster doit servir sans attente.
      activeDossierBudget: 60
  # Connexions gardées hors du budget (superutilisateur, réplication, migrations du Worker, supervision).
  reservedConnections: 25
  # Au-delà, il faut un cluster de plus : le catalogue répartit les dossiers selon leur activité.
  maxActiveDossiersPerCluster: 600
  pooler:
    instances: 2
    # Mesures du POC : pool minuscule par dossier, éviction rapide des connexions inactives.
    defaultPoolSize: 2
    serverIdleTimeout: 10
    maxClientConn: 10000
    maxPreparedStatements: 200
  backup:
    enabled: false
    # Stockage objet de la même région (verrou d'objet), identifiants dans le secret indiqué.
    destinationPath: ""
    endpointURL: ""
    credentialsSecret: lettra-sauvegardes
    schedule: "0 0 2 * * *"
    retention: 30d

# Redis de la cellule (annexe E §2) : cache distribué (HybridCache), sessions du BFF et trousseau Data Protection
# partagé entre les instances de l'API (chantier Identité). L'API reçoit ConnectionStrings__Redis depuis le secret.
# Phase 2 : une instance persistante ; la haute disponibilité (Sentinel ou opérateur) arrive avec la production.
redis:
  enabled: true
  image: valkey/valkey:8.1-alpine
  storage: 2Gi
  # Secret existant (créé par OpenTofu, module cell-bootstrap) : clés « password » et « connection-string ».
  existingSecret: lettra-redis
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
