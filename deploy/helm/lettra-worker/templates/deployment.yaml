{{- if not .Values.image.tag }}{{ fail "image.tag est obligatoire : on déploie une image signée par son SHA, jamais latest" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lettra-worker
  labels:
    app.kubernetes.io/name: lettra-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: lettra
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    lettra.fr/cell: {{ .Values.cell | quote }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lettra-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lettra-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: lettra
        lettra.fr/cell: {{ .Values.cell | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: DOTNET_ENVIRONMENT, value: {{ .Values.dotnetEnvironment | default "Production" | quote }} }
            - { name: Lettra__Observability__Cell, value: {{ .Values.cell | quote }} }
            - { name: Lettra__Observability__Environment, value: {{ .Values.environment | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: {{ .Values.otel.protocol | quote }} }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME)"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- range $key, $value := .Values.settings }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
          {{- with .Values.existingSecret }}
          envFrom:
            - secretRef: { name: {{ . }} }
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
