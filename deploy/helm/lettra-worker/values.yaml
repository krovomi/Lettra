image:
  repository: ghcr.io/krovomi/lettra-worker
  tag: ""
  pullPolicy: IfNotPresent

cell: local
environment: development

settings:
  Lettra__DeploymentMode: HostedSaaS
  Lettra__Observability__ServiceName: lettra-worker
  # Banque connectée : agrégateur simulé dans la démo, aucun agrégateur réel branché ici.
  Lettra__BankConnections__Aggregator: None

existingSecret: ""

# Variables lues dans d'autres secrets (clé de configuration → secret et clé), définies avant les réglages.
secretEnv: {}

otel:
  endpoint: http://lettra-otel-collector.lettra-observabilite:4317
  protocol: grpc

# Un seul Worker actif par cellule en phase 2 : les vagues de migration prennent un bail par dossier dans le catalogue
# (POC base par dossier), plusieurs Workers sont donc possibles plus tard (KEDA sur la file, ADR-0009).
replicas: 1

# Aucune connexion entrante vers le Worker (templates/networkpolicy.yaml).
networkPolicy:
  enabled: true

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }
