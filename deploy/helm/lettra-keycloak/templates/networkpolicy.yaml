{{- if .Values.networkPolicy.enabled }}
# Keycloak n'est joignable que par la passerelle (navigateurs, applications), l'API de la cellule et la supervision.
# Le trafic interne reste en HTTP : c'est cette politique qui le borne à la cellule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  labels:
    {{- include "lettra-keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lettra-keycloak.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.ingressPods }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - { port: 8080 }
    # Instances entre elles : cache distribué (JGroups et détection de panne).
    - from:
        - podSelector:
            matchLabels:
              {{- include "lettra-keycloak.selector" . | nindent 14 }}
      ports:
        - { port: 7800 }
        - { port: 57800 }
    {{- with .Values.networkPolicy.monitoringNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - { port: 9000 }
    {{- end }}
{{- end }}
