apiVersion: v1
kind: ConfigMap
metadata:
  name: lettra-dashboards
  labels:
    {{- include "lettra-observability.labels" . | nindent 4 }}
    {{ .Values.dashboards.label }}: "1"
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
