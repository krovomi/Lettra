apiVersion: v1
kind: ConfigMap
metadata:
  name: lettra-otel-collector
  labels:
    {{- include "lettra-observability.labels" . | nindent 4 }}
data:
  collector.yaml: |-
{{ .Files.Get "files/collector.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lettra-otel-collector
  labels:
    {{- include "lettra-observability.labels" . | nindent 4 }}
    app.kubernetes.io/name: lettra-otel-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lettra-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lettra-otel-collector
      annotations:
        checksum/config: {{ .Files.Get "files/collector.yaml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args: ["--config=/conf/collector.yaml"]
          env:
            - { name: PROMETHEUS_OTLP, value: {{ .Values.collector.prometheusOtlp | quote }} }
            - { name: LOKI_OTLP, value: {{ .Values.collector.lokiOtlp | quote }} }
            - { name: TEMPO_OTLP, value: {{ .Values.collector.tempoOtlp | quote }} }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8888 }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
          livenessProbe:
            httpGet: { path: /, port: 13133 }
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap:
            name: lettra-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: lettra-otel-collector
  labels:
    {{- include "lettra-observability.labels" . | nindent 4 }}
    app.kubernetes.io/name: lettra-otel-collector
spec:
  selector:
    app.kubernetes.io/name: lettra-otel-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8888, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lettra-otel-collector
  labels:
    {{- include "lettra-observability.labels" . | nindent 4 }}
    release: {{ .Values.rules.release }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lettra-otel-collector
  endpoints:
    - port: metrics
      interval: 30s
