# Collecteur OpenTelemetry de la cellule (annexe G §2 et §3). Second filet après le filtrage dans les applications
# (Lettra.Infrastructure.Observability) : attributs interdits supprimés, valeurs qui ressemblent à une donnée de dossier
# masquées (e-mail, IBAN, TVA, SIREN, SIRET), puis export vers Prometheus, Loki et Tempo de la même cellule.
# Les adresses viennent de l'environnement : PROMETHEUS_OTLP, LOKI_OTLP, TEMPO_OTLP.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Attributs qui peuvent porter une saisie : ils ne sortent jamais du collecteur.
  attributes/interdits:
    actions:
      - { key: url.query, action: delete }
      - { key: url.full, action: delete }
      - { key: db.statement, action: delete }
      - { key: db.query.text, action: delete }
      - { key: exception.message, action: delete }
      - { key: exception.stacktrace, action: delete }
      - { key: enduser.id, action: delete }
      - { pattern: ^http\.(request|response)\.header\..*, action: delete }

  redaction/donnees-de-dossier:
    allow_all_keys: true
    blocked_values:
      - '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
      - '\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){2,7}(?:\s?[A-Z0-9]{1,4})?\b'
      - '\bFR\s?[0-9A-Z]{2}\s?\d{9}\b'
      - '\b\d{3}\s?\d{3}\s?\d{3}(?:\s?\d{5})?\b'
    summary: silent

  # Le corps des journaux n'est pas couvert par « redaction » : même masquage par OTTL.
  transform/corps-des-journaux:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}", "***")
          - replace_pattern(body, "\\b[A-Z]{2}\\d{2}(?:\\s?[A-Z0-9]{4}){2,7}(?:\\s?[A-Z0-9]{1,4})?\\b", "***")
          - replace_pattern(body, "\\b\\d{3}\\s?\\d{3}\\s?\\d{3}(?:\\s?\\d{5})?\\b", "***")

  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  otlphttp/prometheus:
    endpoint: ${env:PROMETHEUS_OTLP}
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP}
    tls:
      insecure: true
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP}
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/interdits, redaction/donnees-de-dossier, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/interdits, redaction/donnees-de-dossier, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/interdits, redaction/donnees-de-dossier, transform/corps-des-journaux, batch]
      exporters: [otlphttp/loki]
