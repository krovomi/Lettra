image:
  repository: ghcr.io/krovomi/lettra-api
  tag: ""          # tag imposé par Argo CD (SHA du commit signé par la CI)
  pullPolicy: IfNotPresent

cell: local
environment: development

# Variables de l'application (préfixe Lettra__). Aucun secret ici : voir existingSecret.
settings:
  Lettra__DeploymentMode: HostedSaaS
  Lettra__Observability__ServiceName: lettra-api
  Lettra__Supervision__PublicBaseAddress: https://app.lettra.fr/

# Fournisseur d'identité (Keycloak, realm lettra) : obligatoire dès le mode 2 (ADR-0010). Le secret du client BFF
# (Lettra__Identity__Oidc__BffClientSecret) est dans existingSecret.
oidc:
  authority: ""
  requireHttpsMetadata: true

# Secret existant (coffre de la cellule) chargé en variables d'environnement : chaînes de connexion des clusters,
# jeton du webhook Alertmanager (Lettra__Supervision__WebhookToken), clés.
existingSecret: ""

# Variables lues dans d'autres secrets (clé de configuration → secret et clé).
secretEnv:
  ConnectionStrings__Redis: { secret: lettra-redis, key: connection-string }

otel:
  endpoint: http://lettra-otel-collector.lettra-observabilite:4317
  protocol: grpc

replicas: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { memory: 768Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Espaces de noms autorisés à appeler l'API (passerelle de la cellule, Alertmanager pour le webhook).
  ingressNamespaces: [lettra-passerelle, lettra-observabilite]

service:
  port: 80
