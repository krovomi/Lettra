{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lettra-api
  labels:
    {{- include "lettra-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lettra-api.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - { port: 8080 }
{{- end }}
