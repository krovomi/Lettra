# Démonstration seulement (compose.observabilite.yaml) : Tempo en un seul processus, stockage local dans un volume.
# Traces gardées 7 jours, comme dans une cellule (annexe G §3). Aucune statistique d'usage envoyée à Grafana Labs.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Les traces de la démonstration sont vite consultables.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
