# Démonstration seulement (compose.observabilite.yaml). Prometheus reçoit les métriques en OTLP, comme celui d'une
# cellule, et évalue les mêmes règles (deploy/helm/lettra-observability/files/rules) : les alertes s'affichent dans
# Grafana. Pas d'Alertmanager ici : aucune notification ne part. Au démarrage, la section « otlp » de la cellule
# (files/prometheus-otlp.yml) est ajoutée à la fin de ce fichier (voir compose.observabilite.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cell: demo

rule_files:
  - /etc/lettra/rules/*.yml

scrape_configs:
  # Métriques propres du collecteur (exportations en échec : règle CollecteurPerdDesSignaux).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Indicateurs de pilotage de l'API (docs/indicateurs-grafana.md) : tableaux « Pilotage du cabinet », « Pilotage d'un
  # dossier » et « Administration ». Lus directement sur l'API, hors du chemin OpenTelemetry : ces valeurs ne sortent pas
  # de la cellule. Jeton FICTIF de démonstration, le même que Lettra__Kpi__ScrapeToken de l'API (compose.observabilite.yaml).
  # L'API refait sa collecte toutes les 5 minutes au plus ; une lecture par minute suffit.
  - job_name: lettra-kpi
    metrics_path: /internal/kpi/metrics
    scrape_interval: 60s
    scrape_timeout: 30s
    authorization:
      credentials: demo-indicateurs-fictif-2026
    static_configs:
      - targets: ["api:8080"]

storage:
  tsdb:
    # Les lots OTLP du collecteur peuvent arriver un peu dans le désordre.
    out_of_order_time_window: 10m

