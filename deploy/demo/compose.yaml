# Démonstration navigateur de Lettra (mode 2, réseau local) : Keycloak + API, qui sert l'application PWA.
# Seul Docker est nécessaire (Docker Desktop sous Windows et macOS, Docker Engine sous Linux), pas de SDK .NET.
#
#   docker compose -f deploy/demo/compose.yaml up -d --build --wait      puis http://localhost:8080/
#   docker compose -f deploy/demo/compose.yaml down                      arrêt (les données restent)
#   docker compose -f deploy/demo/compose.yaml down -v                   arrêt et remise à zéro (saisies comprises)
#
# Mise à jour : git pull puis la même commande up -d --build --wait. Les saisies sont dans les volumes nommés
# lettra-demo_* (le nom du projet ci-dessous, à ne pas changer) : une nouvelle image de l'API les retrouve.
#
# Données et secrets FICTIFS, réservés à la démonstration (.env) : ne jamais réutiliser en production.
# Accès depuis un téléphone (HTTPS sur le réseau local) : compose.lan.yaml, voir README.md.
#
# Voix (dictée et commandes) : le conteneur whisper (serveur whisper.cpp, local) télécharge son modèle (142 Mio) au
# premier démarrage dans le volume whisper-modeles. L'API démarre sans l'attendre ; la transcription répond 503 tant
# que le modèle n'est pas chargé. Remettre ce volume à zéro ne fait que retélécharger le modèle.
name: lettra-demo

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # Le realm versionné, complété du cabinet et de l'utilisateur de démonstration (keycloak/start.sh).
    entrypoint: ["/bin/bash", "/opt/lettra/start.sh"]
    command: ["start-dev", "--import-realm", "--features=organization"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?voir deploy/demo/.env}
      KC_HEALTH_ENABLED: "true"
      # Émetteur des jetons : l'adresse vue par le navigateur. L'API, elle, appelle Keycloak par le réseau Docker
      # (http://keycloak:8080) : les points d'accès serveur à serveur suivent l'adresse de la requête.
      KC_HOSTNAME: http://localhost:${LETTRA_DEMO_KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      LETTRA_PUBLIC_URL: http://localhost:${LETTRA_DEMO_PORT:-8080}
      LETTRA_BFF_CLIENT_SECRET: ${LETTRA_BFF_CLIENT_SECRET:?voir deploy/demo/.env}
      LETTRA_DEMO_PASSWORD: ${LETTRA_DEMO_PASSWORD:?voir deploy/demo/.env}
      # Révision du realm de démonstration, à changer avec realm-lettra.json ou keycloak/ : la mise à jour (up -d --build)
      # recrée alors Keycloak, qui importe le realm corrigé dans une base neuve (keycloak/start.sh). Les saisies de
      # Lettra ne sont pas dans Keycloak ; seul l'enrôlement TOTP de l'utilisateur fictif est à refaire.
      LETTRA_DEMO_REALM_REVISION: "2026-10-17 serveur commun"
    ports:
      - "127.0.0.1:${LETTRA_DEMO_KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ../keycloak/realm-lettra.json:/opt/lettra/realm-lettra.json:ro
      - ./keycloak/demo-additions.json:/opt/lettra/demo-additions.json:ro
      - ./keycloak/start.sh:/opt/lettra/start.sh:ro
      - keycloak-donnees:/opt/keycloak/data
    healthcheck:
      # Ni curl ni wget dans l'image : requête HTTP en bash pur sur le port de gestion.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lettra-demo-api
    depends_on:
      keycloak:
        condition: service_healthy
      # Démarré seulement, pas prêt : la démonstration n'attend pas le téléchargement du modèle Whisper.
      whisper:
        condition: service_started
    environment:
      # Environnement « Demo » : même comportement que Production (en-têtes, CSP, pages d'erreur, cookies), seul le
      # jeu de démonstration y est permis (il refuse toujours Production).
      ASPNETCORE_ENVIRONMENT: Demo
      Lettra__DeploymentMode: LocalNetwork
      Lettra__EInvoicing__Platform: Simulated
      # Pas de Worker dans la démonstration : l'API reprend les envois mis en file pendant une panne de la plateforme.
      Lettra__Outbox__Job__HostedByApi: "true"
      Lettra__Identity__Oidc__Authority: http://keycloak:8080/realms/lettra
      Lettra__Identity__Oidc__RequireHttpsMetadata: "false"
      Lettra__Identity__Oidc__BffClientSecret: ${LETTRA_BFF_CLIENT_SECRET}
      # Émetteur attendu (information) : s'il change, Compose recrée l'API, qui relit la découverte de Keycloak.
      LETTRA_DEMO_EMETTEUR: http://localhost:${LETTRA_DEMO_KEYCLOAK_PORT:-8081}/realms/lettra
      # Même révision que Keycloak : l'API est recréée avec lui et relit ses nouvelles clés de signature (sans quoi la
      # première connexion après la mise à jour échoue une fois).
      LETTRA_DEMO_REALM_REVISION: "2026-10-17 serveur commun"
      # Cabinet de démonstration : même identifiant que l'organisation Keycloak.
      Lettra__Organisations__0__Id: 0199e3a0-0000-7000-8000-0000000000c1
      Lettra__Organisations__0__Name: Cabinet de démonstration
      Lettra__Organisations__0__Kek: ${LETTRA_DEMO_KEK:?voir deploy/demo/.env}
      Lettra__Clusters__local__Provider: Sqlite
      Lettra__Clusters__local__Directory: /home/app/dossiers
      # Dossier ouvert par l'application (wwwroot/appsettings.json de Lettra.Web).
      Lettra__Dossiers__0__Id: 0199e3a0-0000-7000-8000-00000000d051
      Lettra__Dossiers__0__OrganisationId: 0199e3a0-0000-7000-8000-0000000000c1
      Lettra__Dossiers__0__Name: Dossier de démonstration
      Lettra__Dossiers__0__Provider: Sqlite
      Lettra__Dossiers__0__ConnectionSecretRef: config:DossierDemo
      ConnectionStrings__Catalog: Data Source=/home/app/lettra-catalogue.db
      ConnectionStrings__DossierDemo: Data Source=/home/app/lettra-dossier-demo.db
      # L'utilisateur de démonstration (sub Keycloak) est manager du cabinet.
      Lettra__Authorization__Users__0__Id: 0199e3a0-0000-7000-8000-0000000de001
      Lettra__Authorization__Users__0__Cabinet: 0199e3a0-0000-7000-8000-0000000000c1
      Lettra__Authorization__Users__0__State: Active
      Lettra__Authorization__Users__0__Assignments__0__Role: manager
      Lettra__Authorization__Users__0__Assignments__0__Scope: Cabinet
      Lettra__Authorization__Users__0__Assignments__0__ScopeId: 0199e3a0-0000-7000-8000-0000000000c1
      # Espace « Équipe et accès » : l'utilisateur fictif en est aussi l'administrateur. Nom et adresse ne s'appliquent
      # que s'ils sont renseignés : rien de déjà saisi n'est écrasé.
      Lettra__Authorization__Users__0__DisplayName: Camille Démo
      Lettra__Authorization__Users__0__Email: demo@cabinet-demo.example
      Lettra__Authorization__Users__0__Assignments__1__Role: administrateur-cabinet
      Lettra__Authorization__Users__0__Assignments__1__Scope: Cabinet
      Lettra__Authorization__Users__0__Assignments__1__ScopeId: 0199e3a0-0000-7000-8000-0000000000c1
      # Factures récurrentes : sans Worker, l'API crée les factures dues toutes les 15 minutes sous un compte de service
      # fictif, déclaré au registre des droits avec un rôle limité à la facturation (pas de compte Keycloak : personne
      # ne s'y connecte). La validation automatique d'un modèle passe par la séparation des tâches du cabinet.
      Lettra__Worker__RecurringInvoices__ServiceAccountId: 0199e3a0-0000-7000-8000-0000000005e1
      Lettra__Worker__RecurringInvoices__InitialDelay: "00:01:00"
      Lettra__Worker__RecurringInvoices__Interval: "00:15:00"
      Lettra__Authorization__Roles__0__Cabinet: 0199e3a0-0000-7000-8000-0000000000c1
      Lettra__Authorization__Roles__0__Key: facturation-recurrente
      Lettra__Authorization__Roles__0__WidestScope: Cabinet
      Lettra__Authorization__Roles__0__Permissions__0: DossierLire
      Lettra__Authorization__Roles__0__Permissions__1: TiersConsulter
      Lettra__Authorization__Roles__0__Permissions__2: CatalogueConsulter
      Lettra__Authorization__Roles__0__Permissions__3: FactureSaisir
      Lettra__Authorization__Roles__0__Permissions__4: FactureValider
      Lettra__Authorization__Users__1__Id: 0199e3a0-0000-7000-8000-0000000005e1
      Lettra__Authorization__Users__1__Cabinet: 0199e3a0-0000-7000-8000-0000000000c1
      Lettra__Authorization__Users__1__State: Active
      Lettra__Authorization__Users__1__DisplayName: Facturation récurrente (automatique)
      Lettra__Authorization__Users__1__Assignments__0__Role: facturation-recurrente
      Lettra__Authorization__Users__1__Assignments__0__Scope: Cabinet
      Lettra__Authorization__Users__1__Assignments__0__ScopeId: 0199e3a0-0000-7000-8000-0000000000c1
      # Jeu « Cabinet Démo » (Lettra.DemoData) : un an d'activité dans le dossier de démonstration, au nom de
      # l'utilisateur de démonstration, au premier démarrage seulement (environ 25 s ; ignoré si le dossier a des pièces).
      Lettra__Demo__Seed: "true"
      Lettra__Demo__UserId: 0199e3a0-0000-7000-8000-0000000de001
      # Deux dossiers de plus dans le cabinet (Bâti Rénov' Lemoine, Négoce Méditerranée Distribution) pour la vue cabinet
      # et le sélecteur de dossier. Créés une seule fois, y compris dans une démo déjà remplie ; rien n'est vidé.
      Lettra__Demo__AdditionalDossiers: "2"
      # Voix : serveur whisper.cpp de la démonstration, joint par le réseau Docker. L'audio ne sort pas du poste.
      Lettra__Speech__Engine: WhisperServer
      Lettra__Speech__WhisperServer__Endpoint: http://whisper:8080/
    ports:
      - "127.0.0.1:${LETTRA_DEMO_PORT:-8080}:8080"
    volumes:
      # Catalogue, dossier SQLite et clés de session (DataProtection) : dossier personnel de l'utilisateur de l'image.
      - lettra-donnees:/home/app

  # Dictée et commandes vocales : serveur whisper.cpp v1.8.7, construit depuis build/voix/whisper-server (la même image
  # que le workflow « Voix » ; image de base épinglée par empreinte, source vérifiée par son commit). Au premier
  # démarrage, le modèle ggml-base.bin (142 Mio) est téléchargé depuis le dépôt public de whisper.cpp et vérifié par
  # son empreinte SHA-1 (465707469ff3a37a2b9b8d8f89f2f99de7299dac), puis gardé dans le volume whisper-modeles.
  # Aucun port publié : seule l'API l'appelle. Pas de healthcheck : « up --wait » n'attend pas le téléchargement, et
  # une démo sans Internet démarre quand même (le conteneur réessaie le téléchargement toutes les 30 s).
  whisper:
    build:
      context: ../../build/voix/whisper-server
    image: lettra-demo-whisper
    # Arrêt immédiat par « down » : tini transmet le signal à la boucle ci-dessous.
    init: true
    entrypoint: ["/bin/sh", "-c", "until /usr/local/bin/entrypoint.sh; do echo 'Whisper : nouvel essai dans 30 s' >&2; sleep 30; done"]
    environment:
      WHISPER_MODEL: base
    restart: unless-stopped
    volumes:
      - whisper-modeles:/models

volumes:
  keycloak-donnees:
  lettra-donnees:
  whisper-modeles:
