# Option de la démonstration : l'API exporte ses traces, métriques et journaux en OTLP vers un collecteur OpenTelemetry
# local, qui applique le même filtrage que celui d'une cellule (deploy/helm/lettra-observability/files/collector.yaml).
# La démonstration seule (compose.yaml) ne change pas ; ce fichier s'y ajoute :
#
#   docker compose -f deploy/demo/compose.yaml -f deploy/demo/compose.otel.yaml up -d --build --wait
#   docker compose -f deploy/demo/compose.yaml -f deploy/demo/compose.otel.yaml logs -f otel-collector
#   curl -s http://localhost:8889/metrics | grep lettra_use_case
#
# Le journal du collecteur montre en détail ce qui sort du filtrage (données fictives seulement) : voir README.md.
services:
  otel-collector:
    # Même version que la cellule (deploy/helm/lettra-observability/values.yaml).
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/conf/collector.yaml", "--config=/conf/demo.yaml"]
    environment:
      # Exportateur Prometheus OTLP de la cellule, inutilisé ici (les métriques sont exposées sur le port 8889).
      PROMETHEUS_OTLP: http://non-utilise.invalid
    ports:
      - "127.0.0.1:${LETTRA_DEMO_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${LETTRA_DEMO_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${LETTRA_DEMO_METRIQUES_PORT:-8889}:8889"
    volumes:
      - ../helm/lettra-observability/files/collector.yaml:/conf/collector.yaml:ro
      - ./otel/collecteur-demo.yaml:/conf/demo.yaml:ro

  api:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      Lettra__Observability__ServiceName: lettra-api
      Lettra__Observability__Cell: demo
      Lettra__Observability__Environment: demo
