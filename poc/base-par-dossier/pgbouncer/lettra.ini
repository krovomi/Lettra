[databases]
; Joker : toutes les bases de dossiers du cluster passent par ce PgBouncer, sans les lister.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 2
min_pool_size = 0
; Plafond global de connexions serveur pour l'application (un seul rôle) : les dossiers se partagent ce budget.
max_user_connections = 120
reserve_pool_size = 0
server_idle_timeout = 10
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
admin_users = postgres
logfile = /srv/lettra/pgbouncer.log
pidfile = /srv/lettra/pgbouncer.pid
